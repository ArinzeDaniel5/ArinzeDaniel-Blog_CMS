<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="Width=device-width,
    initial-scale=1.0">
    <title>Post</title>
    <link rel="stylesheet"href="css/style.css">
</head>
<body>
    <div class="single-post"id="singlePost"></div>
    <script type="module">
        import {getPosts} from "./js/storage.js";
        const container=document.getElementById("singlePost");
        const params=new URLSearchParams(window.location.search);
        const id=params.get("id");
        const posts=getPosts();
        const post=posts.find(p=>p.id==id);
        if(post){
            container.innerHTML=`
            <img src="${post.image}"class="single-image">
            <h1>${post.title}</h1>
            <span>${post.category}</span>
            <p>${post.content}</p>
            `
            ;
            }
    </script>
</body>
</html>
